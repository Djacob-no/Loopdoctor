[project]
name = "weightshift"
version = "0.1.0"
description = "WeightShift: a small warehouse grid game for weight-space programming experiments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "gymnasium>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weightshift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
