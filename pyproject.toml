[project]
name = "weightshift"
version = "0.1.0"
description = "WeightShift: a small warehouse grid game for weight-space programming experiments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "gymnasium>=1.0",
    "torch>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

# PyTorch from the CPU-only index (FINAL_PLAN §6.1: a 20k-parameter MLP trains on the CPU).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weightshift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "golden: reproduces MIT's Exp 4 from its published files (run scripts/fetch_exp4.py first)",
    "gates: recomputes the committed Delivery 3 gate reports and failure cards (slow)",
]
